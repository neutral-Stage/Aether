# Model router role → backend mapping (§6.3)
#
# Roles:
#   local_fast      — reflexive UI steps, simple tool picks (Ollama/MLX/llama.cpp)
#   cloud_frontier  — planning, hard reasoning, novel goals
#   vision          — screenshot + VLM/OCR when AX is insufficient
#
# Provider API keys are read from environment variables (never commit secrets).
# Set keys in `.env` — see `.env.example`.

default_role: cloud_frontier

# Reusable provider templates — referenced by roles via `provider: <name>`
providers:
  anthropic:
    # Failover + computer-use fallback. Current Claude models reject sampling
    # parameters; the client drops `temperature` for them automatically.
    backend: anthropic
    api_key_env: ANTHROPIC_API_KEY
    model: claude-sonnet-5
    max_tokens: 4096
    temperature: 0

  openai:
    backend: openai_compatible
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com/v1
    model: gpt-4o-mini
    max_tokens: 1024
    temperature: 0
    provider_label: openai

  openrouter:
    backend: openai_compatible
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    model: anthropic/claude-sonnet-4
    max_tokens: 1024
    temperature: 0
    provider_label: openrouter
    extra_headers:
      HTTP-Referer: https://github.com/aether-agent
      X-Title: Aether

  groq:
    backend: openai_compatible
    api_key_env: GROQ_API_KEY
    base_url: https://api.groq.com/openai/v1
    model: llama-3.3-70b-versatile
    max_tokens: 1024
    temperature: 0
    provider_label: groq
    images: false            # text-only model: screenshots become a note

  fireworks:
    backend: openai_compatible
    api_key_env: FIREWORKS_API_KEY
    base_url: https://api.fireworks.ai/inference/v1
    model: accounts/fireworks/models/llama-v3p3-70b-instruct
    max_tokens: 1024
    temperature: 0
    provider_label: fireworks

  kilo:
    backend: openai_compatible
    api_key_env: KILO_API_KEY
    base_url: https://api.kilo.ai/api/gateway
    model: anthropic/claude-sonnet-4.6
    max_tokens: 1024
    temperature: 0
    provider_label: kilo

  kie_gemini:
    # Kie uses model-specific paths — pick the endpoint for your subscribed model
    backend: openai_compatible
    api_key_env: KIE_API_KEY
    base_url: https://api.kie.ai/gemini-2.5-pro/v1
    model: gemini-2.5-pro
    max_tokens: 1024
    temperature: 0
    provider_label: kie

  zai:
    # GLM-5.3-Flash — default brain (cloud_frontier). Natively multimodal, so the
    # same model also serves the vision role. OpenAI-compatible tool calls, 1M
    # context. Z.ai coding-plan endpoint; if it rejects the model, use the
    # general endpoint https://api.z.ai/api/paas/v4.
    backend: openai_compatible
    api_key_env: ZAI_API_KEY
    base_url: https://api.z.ai/api/coding/paas/v4
    model: glm-5.3-flash
    max_tokens: 4096
    temperature: 0
    provider_label: zai

  zai_vision:
    # Vision role: the same natively multimodal GLM-5.3-Flash (image input in
    # the same call). Kept as its own template so vision can be pointed at a
    # different model without touching the reasoning role.
    backend: openai_compatible
    api_key_env: ZAI_API_KEY
    base_url: https://api.z.ai/api/coding/paas/v4
    model: glm-5.3-flash
    max_tokens: 4096
    temperature: 0
    provider_label: zai_vision

  google:
    backend: google
    api_key_env: GOOGLE_API_KEY
    model: gemini-2.0-flash
    max_tokens: 1024
    temperature: 0

# Fallback chain when a backend is unavailable
fallback_order:
  - local_fast
  - cloud_frontier

# Per-role provider failover (Phase 10, NFR-3): on transient LLM errors (503, rate
# limit), try ``failover_providers`` in order after the primary ``provider``.
# Unit tests: tests/unit/test_router_failover.py

roles:
  local_fast:
    backend: http          # http | anthropic | openai_compatible | google
    endpoint: http://localhost:11434/api/chat   # Ollama-compatible
    model: llama3.2:3b
    max_tokens: 512
    temperature: 0
    timeout_seconds: 30
    native_tools: false    # true → use Ollama native /api/chat tools field (Phase 1)

  cloud_frontier:
    provider: zai              # default brain — GLM-5.3-Flash via Z.ai
    failover_providers:
      - anthropic
      - openrouter
      - groq
    # provider: anthropic
    # provider: openrouter
    # provider: groq
    # provider: openai
    # provider: kilo
    # provider: kie_gemini
    # provider: google

  vision:
    provider: zai_vision       # GLM-5.3-Flash (native image input) via Z.ai
    failover_providers:
      - anthropic
      - openrouter
      - google
    ocr_only: false
    # Optional VLM HTTP endpoint (OpenAI-compatible /v1/chat/completions with image)
    vlm_endpoint: null
    vlm_model: null

# Vision grounding (how screenshots are sized for models and how the model's
# coordinates are read). scripts/calibrate_grounding.py measures this per
# machine and writes <data_dir>/grounding_calibration.json, which overrides
# these defaults.
grounding:
  max_image_edge: 1600      # long edge (px) of images sent to a model
  coord_space: auto         # pixels | norm1000 | auto (auto: calibrated or pixels)
  # Optional local grounding model for click_described / point_at(description=):
  # a UI-TARS-style model on an OpenAI-compatible server on this Mac, e.g.
  #   pip install mlx-vlm && python -m mlx_vlm.server --model mlx-community/UI-TARS-1.5-7B-4bit --port 8080
  # Used only when enabled AND answering on a loopback address; otherwise the
  # vision role above does the locating.
  local_grounder:
    enabled: false
    base_url: http://127.0.0.1:8080/v1
    model: mlx-community/UI-TARS-1.5-7B-4bit
    coord_space: pixels     # pixels (image it was sent) | norm1000 (0-1000 grid)

# Routing heuristics
routing:
  # Steps with this many prior failures on the current goal → cloud
  failure_threshold_cloud: 2
  # Empty AX tree → vision path
  ax_empty_threshold: 3
  # Vision content-classifier tuning (Phase 1)
  ax_text_coverage_threshold: 0.15   # AX text ratio below this + text_heavy → vision
  text_heavy_char_threshold: 200      # min OCR chars to consider a screen text-heavy
  text_coverage_threshold: 0.05       # min OCR text-area coverage for text-heavy
  min_region_confidence: 0.3          # discard OCR boxes below this confidence
  # Reflexive tools that may use local_fast when AX is sufficient
  reflexive_tools:
    - open_app
    - click
    - press_key
    - type_text
    - finder_go_to
    - safari_open_url
