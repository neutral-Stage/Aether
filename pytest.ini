[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: fast unit tests with mocks (no macOS APIs)
    integration: sidecar HTTP integration tests
    security: prompt injection and policy red-team tests
    benchmark: task benchmark harness (may be slow or mocked)
addopts = -ra --strict-markers
