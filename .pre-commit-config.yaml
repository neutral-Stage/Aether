repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: pytest-security
        name: pytest security suite
        entry: python -m pytest tests/security/ -q
        language: system
        pass_filenames: false
        always_run: true
