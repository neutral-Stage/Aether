name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-sidecar.txt

      - name: Compile Python
        run: python -m compileall -q aether sidecar tests aether/plugins plugins

      - name: Ruff
        run: ruff check aether sidecar tests

      - name: Run pytest
        run: python -m pytest tests/ -q

      - name: Security test count
        run: |
          COUNT=$(python -m pytest tests/security/ --collect-only -q 2>/dev/null | tail -1 | grep -oE '[0-9]+' | tail -1 || echo 0)
          echo "## Security tests: ${COUNT}" >> "$GITHUB_STEP_SUMMARY"
          python -m pytest tests/security/ -q

      - name: Validate knowledge packs
        run: python scripts/validate_packs.py

      - name: Benchmark mock suite
        run: python scripts/benchmark_tasks.py --mock

      - name: Export tool schemas (check drift)
        run: |
          python scripts/export_tool_schemas.py
          git diff --exit-code shared/tool_schemas/ || (
            echo "::error::Tool schemas out of date. Run scripts/export_tool_schemas.py"
            exit 1
          )

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift build
        working-directory: macos/Aether
        run: swift build

      - name: Swift test
        working-directory: macos/Aether
        run: swift test
