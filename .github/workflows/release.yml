# Build and publish Aether.dmg on version tags (v*).
#
# Works out of the box with ad-hoc signing so every tagged release gets a
# downloadable DMG on GitHub Releases (which UpdateChecker.swift checks).
# When APPLE_DEVELOPER_ID (+ optional APPLE_ID / APPLE_TEAM_ID / NOTARY_PASSWORD)
# secrets are configured, signs with Developer ID and notarizes before packaging.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Run Python & Swift tests
        run: |
          python -m pytest tests/ -q
          cd macos/Aether && swift test

      - name: Build Aether.app (with bundled standalone sidecar)
        run: bash macos/scripts/build-dmg.sh --app-only

      - name: Sign & notarize (when Developer ID secret is present)
        if: ${{ env.CODESIGN_IDENTITY != '' }}
        env:
          CODESIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: bash macos/scripts/sign-and-notarize.sh macos/build/Aether.app

      - name: Package DMG
        run: |
          rm -f macos/build/Aether.dmg
          hdiutil create -volname "Aether" -srcfolder macos/build/Aether.app -ov -format UDZO macos/build/Aether.dmg
          shasum -a 256 macos/build/Aether.dmg > macos/build/Aether.dmg.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: aether-release-${{ github.ref_name }}
          path: |
            VERSION
            macos/build/Aether.dmg
            macos/build/Aether.dmg.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" macos/build/Aether.dmg macos/build/Aether.dmg.sha256 --clobber
          else
            gh release create "$TAG" macos/build/Aether.dmg macos/build/Aether.dmg.sha256 \
              --title "Aether ${TAG}" --generate-notes
          fi
