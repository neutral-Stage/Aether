# Reminders.app knowledge pack — Phase 1
app: Reminders
tier: 1
bundle_ids:
  - com.apple.reminders
aliases:
  - reminders
shortcuts:
  - "⌘N — new reminder"
  - "⌘F — search"
  - "⌘1/⌘2/⌘3 — switch between Today/Scheduled/All"
recipes:
  add_reminder:
    - "AppleScript: tell application \"Reminders\" to make new reminder with properties {name:\"<text>\"}"
    - "Or ⌘N, type the reminder text, set a date with natural language, Return"
  complete_reminder:
    - "Click the radio circle to the left of the reminder, or select it and press the spacebar"
gotchas:
  - "A specific list must exist before adding to it via AppleScript"
  - "Natural-language dates ('tomorrow 9am') are parsed only in the typed UI, not AppleScript"
  - "If Reminders is connected under Integrations, prefer reminders_list / reminders_add over UI automation"
scripting:
  run_applescript: "Create/complete reminders deterministically via AppleScript"
verified_recipes:
  add_reminder:
    match: ["remind me", "add a reminder", "new reminder", "create a reminder"]
    steps:
      - {tool: run_applescript, args: {source: "tell application \"Reminders\" to make new reminder with properties {name:\"<what to remember>\"}"}}
    guide:
      - {say: "Open Reminders.", done_when: app, expect: Reminders}
      - {say: "Press Command N for a new reminder.", done_when: any}
      - {say: "Type what you want to be reminded of and press Return.", done_when: any}
